[project]
name = "intoner"
version = "0.1.0"
description = "Chinese poetry intoning synthesis with CFE and PIS"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops==0.3.2",
    "g2pM==0.1.2.5",
    "h5py==3.8.0",
    "jieba==0.42.1",
    "librosa==0.9.2",
    "matplotlib==3.7.5",
    "numba==0.56.4",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "pillow==10.4.0",
    "praat-parselmouth==0.4.3",
    "pyloudnorm==0.1.0",
    "pytorch-lightning==0.7.1",
    "pycwt==0.3.0a22",
    "pypinyin==0.43.0",
    "resemblyzer==0.1.4",
    "scikit-image==0.21.0",
    "scikit-learn==1.2.2",
    "scipy==1.10.1",
    "setuptools==68.2.2",
    "soundfile==0.14.0",
    "tensorboard==2.12.3",
    "tensorboardX==2.6.2.2",
    "torch==1.13.1",
    "tqdm==4.66.6",
    "webrtcvad==2.0.10",
    "PyYAML==6.0.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intoner*"]

[tool.uv.extra-build-dependencies]
jieba = ["setuptools==68.2.2", "wheel==0.48.0"]
